<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTS-FT-004 Análisis de Trabajo Seguro (ATS) - PINTEGRALCO</title>
  <style>
    :root { --primary: #c00000; --bg: #f1f5f9; --card: #ffffff; --ok: #16a34a; }
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; padding: 10px; background: var(--bg); color: #0f172a; font-size: 12px; }
    .container { max-width: 1020px; margin: 0 auto; background: var(--card); border: 1px solid #94a3b8; padding: 14px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; align-items: center; justify-content: space-between; }
    .toolbar button { border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-cloud { background: #16a34a; color: #fff; }
    .btn-repeat { background: #f59e0b; color: #000; }
    .btn-print { background: #2563eb; color: #fff; }
    .btn-add { background: #f59e0b; color: #000; }
    .btn-clear { background: #64748b; color: #fff; }

    .saved-bar { display: none; background: #fefce8; border: 1px solid #f59e0b; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; align-items: center; gap: 8px; flex-wrap: wrap; }
    .saved-bar select { flex: 1; min-width: 220px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }
    .saved-bar button { border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11.5px; }

    table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
    th, td { border: 1px solid #000; padding: 4px 6px; vertical-align: middle; }
    .brand-title { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
    .brand-sub { font-size: 9.5px; color: #475569; letter-spacing: 1.5px; }
    .form-title { font-size: 15px; font-weight: bold; text-align: center; }
    .th-red { background: #c00000; color: #fff; font-weight: bold; text-align: center; font-size: 11px; }
    .th-gray { background: #e2e8f0; color: #000; font-weight: bold; font-size: 10.5px; text-align: left; }

    input[type="text"], input[type="date"], textarea { width: 100%; border: none; outline: none; font-size: 11.5px; background: transparent; font-family: inherit; }
    input[type="text"]:focus, textarea:focus { background: #fefce8; }

    .etapas-table th { background: #1e293b; color: #fff; font-size: 10.5px; text-align: center; }
    .etapas-table tr.etapa-activa { background: #fefce8; outline: 2px solid #f59e0b; }
    .etapas-table tr { cursor: pointer; }
    .etapa-badge { display: inline-block; padding: 2px 5px; border-radius: 3px; font-weight: bold; font-size: 11px; }
    .etapa-activa .etapa-badge { background: #f59e0b; color: #000; }

    .pm-grid, .pm-others-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .pm-item { display: flex; align-items: flex-start; gap: 6px; border: 1px solid #cbd5e1; padding: 4px 6px; border-radius: 4px; cursor: pointer; background: #fff; transition: 0.15s; }
    .pm-item:hover { background: #f8fafc; }
    .pm-item.checked { background: #fef2f2; border-color: #c00000; }
    .pm-item.checked-ctrl { background: #f0fdf4; border-color: #16a34a; }
    .pm-chk { width: 17px; height: 17px; accent-color: #c00000; margin-top: 1px; flex-shrink: 0; cursor: pointer; }
    .pm-chk-ctrl { accent-color: #16a34a; }
    .pm-code { font-weight: bold; min-width: 24px; color: #c00000; }
    .pm-code-ctrl { color: #15803d; }

    .epp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 6px; }
    .epp-item { display: flex; align-items: center; gap: 5px; border: 1px solid #000; padding: 4px 5px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .epp-item.checked { background: #dcfce7; border-color: #15803d; }
    .epp-item input { width: 15px; height: 15px; accent-color: #16a34a; flex-shrink: 0; }

    .crew-table th { background: #c00000; color: #fff; font-size: 10px; text-align: center; padding: 4px 2px; }
    .crew-table td { text-align: center; padding: 3px; }
    .crew-table td.name-cell { text-align: left; width: 28%; }
    .crew-table td.sig-cell { width: 30%; padding: 2px; }
    .day-chk { width: 18px; height: 18px; accent-color: #16a34a; cursor: pointer; }
    canvas.mini-sig { width: 100%; height: 42px; border: 1px dashed #94a3b8; background: #f8fafc; touch-action: none; cursor: crosshair; display: block; }
    .btn-mini-clear { font-size: 9px; color: #64748b; text-decoration: underline; cursor: pointer; display: block; margin-top: 1px; }
    canvas.sup-sig { width: 100%; height: 70px; border: 1px dashed #94a3b8; background: #f8fafc; touch-action: none; cursor: crosshair; display: block; }

    @media screen and (max-width: 768px) {
      .pm-grid, .pm-others-grid { grid-template-columns: 1fr; }
      .epp-grid { grid-template-columns: repeat(2, 1fr); }
      .crew-wrap { overflow-x: auto; }
      .crew-table { min-width: 680px; }
    }

    @page { size: A4 portrait; margin: 4mm; }
    @media print {
      body { background: #fff; padding: 0; margin: 0; font-size: 7px; line-height: 1.05; }
      .container { border: none; box-shadow: none; padding: 0; max-width: 100%; }
      .toolbar, .saved-bar, .no-print, .btn-mini-clear { display: none !important; }
      table { margin-bottom: 3px; }
      th, td { padding: 1.5px 3px; font-size: 7px; }
      input[type="text"], input[type="date"] { font-size: 7px; height: 11px; }
      input::placeholder { color: transparent !important; }
      .etapas-table tr.etapa-activa { background: transparent !important; outline: none !important; }
      .etapa-activa .etapa-badge { background: transparent !important; color: #000 !important; padding: 0; }
      .brand-title { font-size: 13px; }
      .brand-sub { font-size: 7px; }
      .form-title { font-size: 11px; }
      .th-red, .crew-table th, .etapas-table th { background: #c00000 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 7.5px; padding: 2px; }
      .th-gray { background: #e2e8f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 7px; }
      .pm-grid, .pm-others-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 2px 6px !important; margin-bottom: 2px !important; }
      .pm-item { border: 1px solid #cbd5e1 !important; padding: 1px 3px !important; font-size: 6.4px !important; line-height: 1.04 !important; border-radius: 2px !important; gap: 3px !important; align-items: center !important; }
      .pm-chk { width: 9px !important; height: 9px !important; margin: 0 !important; }
      .pm-code { min-width: 16px !important; font-size: 6.5px !important; }
      .epp-grid { display: grid !important; grid-template-columns: repeat(5, 1fr) !important; gap: 2px !important; margin-bottom: 2px !important; }
      .epp-item { padding: 1.5px 2px !important; font-size: 5.8px !important; line-height: 1.02 !important; gap: 2px !important; }
      .epp-item input { width: 8px !important; height: 8px !important; margin: 0 !important; }
      canvas.mini-sig, .sig-cell img { height: 24px !important; border: none !important; background: #fff !important; }
      canvas.sup-sig, .sup-img { height: 34px !important; border: none !important; background: #fff !important; }
      .day-chk { width: 10px !important; height: 10px !important; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="toolbar no-print">
    <div><strong>PINTEGRALCO</strong> — Análisis de Trabajo Seguro (ATS)</div>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button type="button" class="btn-repeat" onclick="toggleBarraRepetir()">🔁 Repetir Tarea Anterior</button>
      <button type="button" class="btn-cloud" id="btnGuardarNube" onclick="enviarATSaDrive()">☁️ Guardar ATS en Nube</button>
      <button type="button" class="btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
      <button type="button" class="btn-clear" onclick="limpiarTodo()">Limpiar</button>
    </div>
  </div>

  <div class="saved-bar no-print" id="barraRepetir">
    <strong>🔁 Seleccionar ATS guardado en este equipo:</strong>
    <select id="selectPlantillas"></select
